# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

# NOTE: no custom domain has been purchased yet, so this points at the default
# GitHub Pages URL. Once thebelgianrunners.com is live, update this to
# "https://thebelgianrunners.com/", add a static/CNAME file with that domain,
# and set the custom domain in the repo's Settings -> Pages.
baseURL = "https://nillsf.github.io/thebelgianrunners/"

# Installed as a git submodule at themes/congo (see .gitmodules)
theme = "congo"

defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
